# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
    - qhull@2012.1
    - suite-sparse@5.4.0
    - superlu-dist@7.2.0
    #  - trilinos@16.1.0 cxxstd=17 ~amesos+hdf5~ifpack2+intrepid2+isorropia+nox+stratimikos+suite-sparse+superlu-dist+teko+tpetra+zoltan
    - cmake@3.30.9
    - openmpi@4.1.8
    - fftw
    - ninja
    - ccache
    - python
    - parmetis@4.0.3
    - metis@5.1.0
    - cln@1.3.4
    - libbacktrace
    - vtk
  view: true
  concretizer:
    unify: true
  packages:
    gcc:
      externals:
        - spec: gcc@13.3.0 languages:='c,c++,fortran'
          prefix: /usr
          extra_attributes:
            compilers:
              c: /usr/bin/gcc
              cxx: /usr/bin/g++
              fortran: /usr/bin/gfortran
